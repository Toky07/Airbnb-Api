# Canonical CI for the Airbnb monorepo lives at the repo root:
#   .github/workflows/api.yml + .github/actions/node-ci
# This workflow only runs when pushing to the Airbnb-Api repository itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airbnb
          POSTGRES_PASSWORD: airbnb
          POSTGRES_DB: airbnb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U airbnb -d airbnb_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: airbnb
      DB_PASSWORD: airbnb
      DB_NAME: airbnb_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:check

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
